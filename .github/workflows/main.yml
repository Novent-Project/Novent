name: Build Novent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist-novent, path: build/, retention-days: 1 }

  tauri:
    name: Build Novent (Windows x64)
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: frontend-dist-novent, path: build/ }

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Compute next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RAW=$(gh release view --repo "$GITHUB_REPOSITORY" \
                  --json tagName --jq .tagName 2>/dev/null || echo "")

          LATEST=$(printf '%s' "$RAW" | tr -d '[:space:]')

          if [[ "$LATEST" =~ ^v?([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            NEXT_NUM="${MAJOR}.$((MINOR + 1))"
          else
            NEXT_NUM="0.4"
          fi

          echo "tag=v${NEXT_NUM}"       >> "$GITHUB_OUTPUT"
          echo "semver=${NEXT_NUM}.0"   >> "$GITHUB_OUTPUT"

      - name: Stamp version into tauri.conf.json
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail

          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a valid semver string: [$APP_VERSION]"
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const p  = 'src-tauri/tauri.conf.json';
            const c  = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.APP_VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Download backend sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          gh release download --repo Novent-Project/Novent-Backend \
            --pattern 'backend-x86_64-pc-windows-msvc.exe' \
            --dir src-tauri/binaries --clobber

      - name: Patch tauri.conf.json for CI
        shell: bash
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('src-tauri/tauri.conf.json')
          c = json.loads(p.read_text())
          c.setdefault('build', {})['beforeBuildCommand'] = ''
          p.write_text(json.dumps(c, indent=2))
          "

      - run: pnpm install --frozen-lockfile

      - name: Delete existing draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r '.[] | select(.tag_name == "${{ steps.version.outputs.tag }}" and .draft == true) | .id')
          if [ -n "$RELEASE_ID" ]; then
            curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${{ steps.version.outputs.tag }}"
          fi

      - name: Build Tauri app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Novent ${{ steps.version.outputs.tag }}
          releaseBody: |
            Automated build from ${{ github.sha }}.
          releaseDraft: true
          prerelease: false