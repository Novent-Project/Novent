name: Build Novent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compute next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RAW=$(gh release view --repo "$GITHUB_REPOSITORY" \
                  --json tagName --jq .tagName 2>/dev/null || echo "")

          # gh emits CRLF on Windows — strip all whitespace before parsing
          LATEST=$(printf '%s' "$RAW" | tr -d '[:space:]')

          if [[ "$LATEST" =~ ^v?([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            NEXT_NUM="${MAJOR}.$((MINOR + 1))"
          else
            NEXT_NUM="0.1"
          fi

          echo "Previous: [${LATEST:-none}]  ->  Next: [v${NEXT_NUM}]"
          echo "tag=v${NEXT_NUM}"       >> "$GITHUB_OUTPUT"
          echo "semver=${NEXT_NUM}.0"   >> "$GITHUB_OUTPUT"

      - name: Stamp version into tauri.conf.json
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail

          echo "Stamping version: [$APP_VERSION]"
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a valid semver string: [$APP_VERSION]"
            exit 1
          fi

          node -e "
            const fs = require('fs');
            const p  = 'src-tauri/tauri.conf.json';
            const c  = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.APP_VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

          node -e "console.log('confirmed:', JSON.stringify(require('./src-tauri/tauri.conf.json').version))"

      - name: Download sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/binaries
          gh release download --repo Novent-Project/Novent-Backend \
            --pattern 'backend-x86_64-pc-windows-msvc.exe' \
            --dir src-tauri/binaries --clobber
          ls -la src-tauri/binaries

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Novent ${{ steps.version.outputs.tag }}
          releaseBody: |
            Automated build from ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          includeDebug: false
