<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>

    <linearGradient id="noventHero" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <clipPath id="roundedBounds">
      <rect width="1280" height="320" rx="18" ry="18"/>
    </clipPath>

  </defs>

  <g clip-path="url(#roundedBounds)">

    <rect width="1280" height="320" fill="#070e09"/>

    <!-- Icon — Novent.svg, 64x64 mark scaled to 3.2x and centered on (640,148) -->
    <g transform="translate(640, 148) scale(3.2) translate(-32, -32)">
      <path d="M14 8 H50 a6 6 0 0 1 6 6 V42 L42 56 H14 a6 6 0 0 1 -6 -6 V14 a6 6 0 0 1 6 -6 Z"
            fill="#10b981" fill-opacity="0.16"
            stroke="url(#noventHero)" stroke-width="3" stroke-linejoin="round"/>
      <path transform="translate(16 23.2) scale(0.2)"
            d="M0,88 L30,88 L46,44 L64,44 L80,88 L110,88 L126,44 L144,44 L160,0 L130,0 L114,44 L96,44 L80,0 L50,0 L34,44 L16,44 Z"
            fill="url(#noventHero)"/>
    </g>

    <!-- Tagline pinned to bottom.
         x=641 not 640: letter-spacing appends a trailing gap after the last glyph,
         which drags a text-anchor="middle" string off-centre. Renderers disagree on
         whether that trailing gap counts, so this splits the difference (<2px either way). -->
    <text
      x="641" y="300"
      text-anchor="middle"
      font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="13"
      font-weight="500"
      letter-spacing="5"
      fill="#a8c4a8"
      opacity="0.4">Free  ·  Fast  ·  Clean</text>

  </g>
</svg>
